[preset.0]
name="macOS"
platform="macOS"
runnable=true
advanced_options=false
export_filter="all_resources"
include_filter="data/*.json,THIRD_PARTY_NOTICES.md"
exclude_filter="tests/*,tools/*,web/*,build/*,README.md"
export_path="build/Miami-Approach-macOS.zip"
script_export_mode=2

[preset.0.options]
application/bundle_identifier="com.ftrap2030.flightsimgpt.miami"
application/short_version="0.1.0"
application/version="0.1.0"
application/min_macos_version_x86_64="13.0"
application/min_macos_version_arm64="13.0"
codesign/codesign=1
notarization/notarization=0


[preset.1]
name="Web"
platform="Web"
runnable=true
advanced_options=false
export_filter="all_resources"
include_filter="data/*.json,THIRD_PARTY_NOTICES.md"
exclude_filter="tests/*,tools/*,web/*,build/*,README.md"
export_path="build/web/index.html"
script_export_mode=2

[preset.1.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
